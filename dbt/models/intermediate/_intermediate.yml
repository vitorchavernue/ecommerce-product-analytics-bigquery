version: 2

models:
  - name: int_orders
    description: Purchases deduplicated by transaction id (first record kept).
    columns:
      - name: transaction_id
        data_tests: [unique, not_null]
      - name: revenue_usd
        data_tests: [not_null]

  - name: int_sessions
    description: One row per visit (user + GA session id).
    columns:
      - name: session_key
        data_tests: [unique, not_null]
      - name: channel
        data_tests: [not_null]

  - name: int_users
    description: One row per user identifier, with acquisition and lifetime totals.
    columns:
      - name: user_pseudo_id
        data_tests: [unique, not_null]
